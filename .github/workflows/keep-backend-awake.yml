name: Keep backend awake

# Render's free tier puts the API to sleep after ~15 idle minutes.
# Pinging it every 10 minutes keeps the live demo responsive.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: curl -fsS --max-time 90 https://educational-course-recommendation-system.onrender.com/ -o /dev/null || echo "Ping failed (server may be waking up)"
